global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:3000"]
  - job_name: empleados
    static_configs:
      - targets: ["empleados:3001"]
  - job_name: nomina
    static_configs:
      - targets: ["nomina:3002"]
  - job_name: reclutamiento
    static_configs:
      - targets: ["reclutamiento:3003"]
